# L0 每日抓取
#
# 原始 bytes → Supabase Storage（gzip，實測壓縮比 7.6x）
# 帳本／健康度 → Supabase raw_snapshots / source_health
# 執行紀錄 → ops/ingest-log.jsonl，直接提交回本 repo
#
# 【為什麼要提交執行紀錄】兩個用途，缺一不可：
#   1. G5「資料管線連續 60 日零故障」需要可稽核的證據鏈
#   2. GitHub 官方明示：public repo 若 60 天無 repository activity，
#      排程會被【自動停用】。若不產生活動，G5 永遠達不成 —— 排程會先自己死掉。
#
# 前置設定：GitHub repo → Settings → Secrets and variables → Actions
#   SUPABASE_URL               = Supabase 專案網址（與 keep-alive 共用，已設定）
#   SUPABASE_SERVICE_ROLE_KEY  = service_role key（本工作流專用，需新增）
#
# 程式讀的環境變數名是 NEXT_PUBLIC_SUPABASE_URL，在下方 env 區塊對應過去，
# 這樣兩個工作流共用同一個 secret，少一個會設錯的地方。
#
# ⚠️ 本 repo 為 public。Actions secrets 不會提供給 fork 的 PR，
#    只有排程與本 repo 的手動觸發拿得到。

name: L0 ingest

on:
  schedule:
    # 【2026-08-19 第二次依實測修正。前兩個版本都錯，把過程留著當教訓】
    #
    # v1  10:40 UTC（台北 18:40）：TWSE 當日收盤資料還沒發布 → 兩市交易日不一致
    # v2  14:40 + 17:40 UTC（台北 22:40 / 01:40）：兩班各踩一個夜間維護時段
    #       23:07 台北 → TWSE 12 個來源 TypeError: fetch failed（連不上）
    #       02:02 台北 → TPEx 13 個來源 HTTP 403
    #
    # v3（本版）改到早上。依據是四個觀測點：
    #       8/17 19:01 台北 → TWSE 給 8/14
    #       8/18 10:20 台北 → TWSE 給 8/17
    #       8/19 02:00 台北 → TWSE 給 8/17
    #       8/19 08:45 台北 → TWSE 給 8/18
    #   一致的解釋是：**TWSE 的日收盤檔在隔天早上才更新**，不是當天晚上。
    #   櫃買則當晚 23:05 就有當日資料（實測），早上自然也有。
    #   ⚠️ 這是四個點推出的最佳解釋，不是官方說法，仍需持續觀察。
    #
    # 【早上抓其實比晚上更正確】
    #   早上抓到的是前一交易日的收盤，訊號當天開盤後才可能進場——
    #   資料時點永遠早於進場時點，不需要額外論證沒有前視偏誤。
    #
    # 兩班都避開整點——GitHub 官方明示整點負載高時排程可能延後甚至被丟棄。
    - cron: '40 1 * * *' # 台北 09:40
    - cron: '40 3 * * *' # 台北 11:40 —— 第一班失敗時的補班
  workflow_dispatch:

permissions:
  contents: write # 需要寫入權限才能提交執行紀錄

concurrency:
  # 同時只允許一個抓取執行，避免兩個 job 同時改 ops/ingest-log.jsonl
  group: l0-ingest
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run L0 ingest
        id: ingest
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${NEXT_PUBLIC_SUPABASE_URL:-}" ] || [ -z "${SUPABASE_SERVICE_ROLE_KEY:-}" ]; then
            echo "::error::Supabase secrets 未設定。抓取會退回本機檔案模式，而 runner 是拋棄式的，資料會遺失。"
            exit 1
          fi
          npm run l0:ingest

      # 抓完才排序。抓取失敗時不出榜 —— 寧可今天沒有清單，也不要一份資料不全的清單。
      #
      # 觀察榜是研究紀錄，不是買進建議（CLAUDE.md）。
      # 排序前會先向 factor_registry 核對 definition_hash，對不上就拒絕出榜。
      #
      # 非交易日不會有新的行情快照，data_as_of 仍是上一個交易日，
      # 唯一索引會擋下重複寫入並回傳 409 —— 那是正常狀態，不是故障，故容許失敗。
      - name: Generate watchlist
        id: picks
        continue-on-error: true
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          # LINE 未設定時只會略過推播，不會讓整條管線失敗
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_CHANNEL_SECRET: ${{ secrets.LINE_CHANNEL_SECRET }}
          LINE_USER_ID: ${{ secrets.LINE_USER_ID }}
        run: npm run l1:picks -- --write --notify

      # 觀察期走完的訊號才會產生結果。未到期一律略過，不會寫入。
      # 這一步失敗不影響已寫入的清單，故容許失敗。
      - name: Compute outcomes
        id: outcomes
        continue-on-error: true
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: npm run l5:outcomes -- --write

      # 市場基準（0050 與官方加權股價報酬指數）。G3 的對照依據，每日累積一點。
      #
      # 【2026-08-22 移除 continue-on-error，這是刻意的】
      # 官方含息指數的滾動視窗回溯到 8/03，早於 L0 起算日，整批被
      # benchmark_daily_no_backfill_check 擋下 —— 而這一步當時是 continue-on-error，
      # 於是**連續兩天默默沒寫入**，整條管線照樣綠燈、日報照樣送出。
      #
      # 與 picks 那一步不同：picks 在非交易日因重複寫入而 exit 1 是**正常**的，
      # 所以必須容許失敗。這一步沒有新資料時是 exit 0，
      # 因此非零結束碼一律代表真的壞了 —— 那就該讓整個 run 紅燈、寄信通知。
      # G5「連續 60 日零故障」本來就該把這種事算成故障。
      - name: Update benchmark (0050 + 加權報酬指數)
        id: benchmark
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: npm run l6:g3 -- --write

      # 排序若因「非重複寫入」以外的原因失敗，要看得見，但不影響執行紀錄提交
      # 【2026-08-19 修正：skipped 不等於 failed，不可報成同一件事】
      # 抓取失敗時，後面三步是被 GitHub **跳過**的，根本沒執行。
      # 舊版把 outcome != success 一律寫成「計算失敗，請查該步驟輸出」，
      # 於是使用者收到失敗通知後，跑去查一個從未執行的步驟，找不到任何輸出。
      # 真正的原因永遠在最前面那一步。訊息要把人指向那裡。
      - name: Report watchlist outcome
        if: always()
        run: |
          report() {
            case "$2" in
              success) echo "$1：成功" ;;
              skipped) echo "::warning::$1：未執行（上游步驟失敗而被跳過）。原因請看 Run L0 ingest 的輸出，不在本步驟。" ;;
              *)       echo "::warning::$1：失敗（outcome=$2）。請查該步驟自身的輸出。" ;;
            esac
          }
          report "觀察榜"   "${{ steps.picks.outcome }}"
          report "outcomes" "${{ steps.outcomes.outcome }}"
          report "0050 基準" "${{ steps.benchmark.outcome }}"
          if [ "${{ steps.picks.outcome }}" = "failure" ]; then
            echo "　（觀察榜失敗最常見的原因是非交易日的重複寫入被唯一索引擋下，那屬正常。）"
          fi

      # 即使抓取失敗也要記錄 —— 失敗本身就是 G5 要追蹤的事實
      - name: Commit run log
        if: always()
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if [ -z "$(git status --porcelain ops/)" ]; then
            echo "執行紀錄無變更，略過提交"
            exit 0
          fi

          git add ops/
          git commit -m "chore(ops): L0 ingest 執行紀錄 $(date -u +%Y-%m-%d)"

          # 併發或人為提交可能讓遠端超前，重試一次再放棄
          for attempt in 1 2 3; do
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            echo "push 第 ${attempt} 次失敗，重試"
            sleep 5
          done
          echo "::error::執行紀錄提交失敗。排程仍有效，但 60 天無活動會被自動停用，需人工處理。"
          exit 1
